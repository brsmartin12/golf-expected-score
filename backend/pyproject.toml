[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golf-expected-score"
version = "0.1.0"
description = "Golf handicap and expected-score calculations (World Handicap System)"
requires-python = ">=3.11"
# The `golf` package itself imports none of these -- the math layer stays plain
# Python. They are here for the `api` package, which wraps it in HTTP.
#   fastapi  - the web framework: routing, validation, OpenAPI docs
#   uvicorn  - the ASGI server that actually runs the app and listens on a port
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # sqlalchemy      - the ORM: models, queries, sessions
    # psycopg[binary] - the Postgres driver SQLAlchemy speaks through. The
    #                   [binary] extra ships prebuilt wheels, so no local
    #                   Postgres headers or C compiler are needed to install it.
    # python-dotenv   - loads backend/.env so DATABASE_URL need not be exported
    #                   by hand in every shell
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    # alembic - schema migrations. create_all only ever creates, so it cannot
    #           change a table that already holds rows.
    "alembic>=1.13",
]

[project.optional-dependencies]
# httpx backs FastAPI's TestClient, which calls the app in-process (no server).
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["golf*", "api*", "db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
